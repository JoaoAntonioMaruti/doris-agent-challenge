services:
  proxy:
    build: ./proxy
    ports: ["3000:3000"]
    environment:
      AGENT_URL: http://agent:8000
      IMAGES_DIR: /seed-images
      DB_PATH: /data/proxy.db
    volumes:
      - ./seed-images:/seed-images:ro
      - proxy-data:/data
    depends_on: [agent]

  agent:
    build:
      context: ./agent
      target: runtime
    env_file: .env
    environment:
      PROXY_URL: http://proxy:3000
      DATABASE_URL: ecto://postgres:postgres@db/doris
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-secret-key-base-not-used-for-cookies-0123456789abcdef}
      PHX_HOST: agent
      MEMORY_MODE: ${MEMORY_MODE:-v1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bin/doris rpc 'Ecto.Adapters.SQL.query!(Doris.Repo, \"SELECT 1\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doris
    volumes:
      - agent-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs mix test / mix format inside Docker: docker compose --profile test run --rm agent-test
  agent-test:
    profiles: [test]
    build:
      context: ./agent
      target: dev
    environment:
      MIX_ENV: test
      DB_HOST: db
    volumes:
      - ./agent:/app
      - /app/deps
      - /app/_build
    depends_on:
      db:
        condition: service_healthy
    command: mix test

volumes:
  proxy-data: {}
  agent-db: {}

services:
  proxy:
    build: ./proxy
    ports: ["3000:3000"]
    environment:
      AGENT_URL: http://agent:8000
      IMAGES_DIR: /seed-images
      DB_PATH: /data/proxy.db
    volumes:
      - ./seed-images:/seed-images:ro
      - proxy-data:/data
    depends_on: [agent]

  agent:
    build:
      context: ./agent
      target: runtime
    env_file: .env
    environment:
      PROXY_URL: http://proxy:3000
      DATABASE_URL: ecto://postgres:postgres@db/doris
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-secret-key-base-not-used-for-cookies-0123456789abcdef}
      PHX_HOST: agent
      MEMORY_MODE: ${MEMORY_MODE:-v2}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bin/doris rpc 'Ecto.Adapters.SQL.query!(Doris.Repo, \"SELECT 1\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: pgvector/pgvector:pg17
    # published only for local inspection (DB UI); the agent uses the internal network
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doris
    volumes:
      - agent-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs mix test / mix format inside Docker: docker compose --profile test run --rm agent-test
  agent-test:
    profiles: [test]
    build:
      context: ./agent
      target: dev
    environment:
      MIX_ENV: test
      DB_HOST: db
    volumes:
      - ./agent:/app
      - /app/deps
      - /app/_build
    depends_on:
      db:
        condition: service_healthy
    command: mix test

  # Fault-injection pair for evals (docker compose --profile eval up -d): a second copy of
  # the unchanged proxy, configured through its own FAULTS_FILE / CATALOG_OVERRIDES_FILE
  # support, wired to a second agent instance.
  proxy-faults:
    profiles: [eval]
    build: ./proxy
    ports: ["3001:3000"]
    environment:
      AGENT_URL: http://agent-eval:8000
      IMAGES_DIR: /seed-images
      DB_PATH: /data/proxy-faults.db
      FAULTS_FILE: /fixtures/faults.json
      CATALOG_OVERRIDES_FILE: /fixtures/catalog_overrides.json
    volumes:
      - ./seed-images:/seed-images:ro
      - ./agent/evals/fixtures:/fixtures:ro
      - proxy-faults-data:/data
    depends_on: [agent-eval]

  agent-eval:
    profiles: [eval]
    build:
      context: ./agent
      target: runtime
    env_file: .env
    environment:
      PROXY_URL: http://proxy-faults:3000
      DATABASE_URL: ecto://postgres:postgres@db/doris
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-secret-key-base-not-used-for-cookies-0123456789abcdef}
      PHX_HOST: agent-eval
      MEMORY_MODE: ${MEMORY_MODE:-v2}
    depends_on:
      db:
        condition: service_healthy

volumes:
  proxy-data: {}
  proxy-faults-data: {}
  agent-db: {}
